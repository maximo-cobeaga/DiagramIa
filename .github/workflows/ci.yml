name: Diagramia checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run schemas
      - run: git diff --exit-code -- schemas/
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: docker compose -f infra/compose.dev.yml config -q
      - run: node scripts/pg-restore-smoke.mjs
      - run: npm run smoke:repository

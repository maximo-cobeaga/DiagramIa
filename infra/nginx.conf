# nginx del contenedor web (P8.4). Plantilla: la imagen oficial reemplaza ${APP_HOST}, ${SITE_HOST} y ${APP_ORIGIN} al iniciar.
# El TLS lo termina el reverse proxy del VPS, que reenvía a este contenedor por loopback.

# La IP real del visitante viene del proxy del VPS (redes privadas o loopback). El gateway recibe sólo esa IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
server_tokens off;

# Editor y gateway: app.<dominio>
server {
  listen 80;
  server_name ${APP_HOST};
  root /srv/app;

  # Sin scripts inline ni eval en el bundle; los estilos inline son atributos style de React.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

  # Página de pago (ADR 094): la única que carga un script de terceros (Paddle.js) y el marco del pago. Lleva su propia política;
  # el editor conserva la suya sin excepciones. Orígenes comprobados en el sandbox con un navegador real, sin violaciones.
  set $csp_pay "default-src 'self'; script-src 'self' https://cdn.paddle.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com https://sandbox-cdn.paddle.com; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://buy.paddle.com https://sandbox-buy.paddle.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  location = /pago.html {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $csp_pay always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\")" always;
    try_files $uri =404;
  }

  # Rutas del gateway para herramientas del propio servidor (token de documentos) y para el espacio local de desarrollo:
  # dan acceso a cualquier documento por su ID, así que no se publican. El editor usa /api/v1/cloud/ con la sesión.
  location ~ ^/api/v1/(documents|local)(/|$) {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Ruta inexistente."}}';
  }
  location /api/ {
    proxy_pass http://api:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 11m;
    proxy_read_timeout 600s;
  }
  # MCP remoto (Streamable HTTP): sin buffer, para que los eventos lleguen en el momento.
  location = /mcp {
    proxy_pass http://api:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /.well-known/oauth-protected-resource {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
  }
  # Contacto de seguridad (RFC 9116): el mismo archivo que publica la landing.
  location = /.well-known/security.txt {
    alias /srv/landing/.well-known/security.txt;
    default_type text/plain;
  }
  # Archivos y carpetas con punto (/.env, /.git/…): nunca existen en el sitio, se responde 404 sin pasar por el editor.
  location ~ /\.(?!well-known/) {
    return 404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  # Enlace compartido de un diagrama (ADR 106). La dirección lleva el token, que es la llave: no se ofrece a buscadores
  # y no viaja en el Referer hacia otros sitios. La página es el mismo editor, que muestra el diagrama en sólo lectura.
  location /s/ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files /index.html =404;
  }
  # El editor sólo vive en / (y en /s/ para los enlaces compartidos): cualquier otra ruta que no sea un archivo publicado
  # responde 404 de verdad en lugar de devolver la app.
  location = / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex" always;
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri =404;
  }
}

# Landing: dominio principal (y cualquier otro host)
server {
  listen 80 default_server;
  server_name ${SITE_HOST};
  root /srv/landing;
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ${APP_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  # El aviso de privacidad vive con el editor (lo sirve la misma app que trata los datos); acá sólo se redirige.
  location = /privacy.html { return 301 https://${APP_HOST}/privacy.html; }
  location = /privacidad.html { return 301 https://${APP_HOST}/privacidad.html; }
  location ~ /\.(?!well-known/) {
    return 404;
  }
  location / {
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri $uri/ =404;
  }
}
